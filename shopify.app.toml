use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://shop-mcp-23.onrender.com/auth/callback", "https://shop-mcp-23.onrender.com/auth/shopify/callback", "https://shop-mcp-23.onrender.com/api/auth/callback" ]
[build]
automatically_update_urls_on_dev = true
