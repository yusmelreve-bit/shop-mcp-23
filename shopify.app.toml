client_id = "8c06c1772b384c7173ae092a5da9fad3"
name = "Shop-MCP"
application_url = "https://shop-mcp-23.onrender.com"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
