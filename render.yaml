services:
  - type: web
    name: shop-mcp-web
    runtime: docker
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/var/data/dev.sqlite
      - key: SCOPES
        value: ""
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
    disk:
      name: shop-mcp-data
      mountPath: /var/data
      sizeGB: 1
